<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Part Scanner</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1B1D21">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#1B1D21;
    --panel:#24272C;
    --panel-2:#2C3036;
    --line:#3A3E45;
    --text:#ECE9E1;
    --text-dim:#9A9C9F;
    --amber:#F2A93B;
    --amber-dark:#4A3210;
    --teal:#4FA79B;
    --red:#D9564F;
    --mono:'IBM Plex Mono', monospace;
    --display:'Oswald', sans-serif;
    --body:'Inter', sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--body);
    min-height:100vh;
    padding:0 0 40px;
  }
  header{
    padding:20px 20px 16px;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    gap:12px;
  }
  header .tag{
    width:10px;height:10px;background:var(--amber);border-radius:2px;flex-shrink:0;
  }
  header h1{
    font-family:var(--display);
    font-weight:600;
    font-size:20px;
    letter-spacing:0.5px;
    text-transform:uppercase;
    margin:0;
  }
  header p{
    margin:2px 0 0;
    font-size:12px;
    color:var(--text-dim);
    font-family:var(--mono);
  }
  main{
    max-width:520px;
    margin:0 auto;
    padding:20px;
  }
  .data-panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:8px;
    padding:8px 12px;
    margin-bottom:12px;
  }
  .data-panel .row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .data-panel .label{
    font-size:9px;
    text-transform:uppercase;
    letter-spacing:0.8px;
    color:var(--text-dim);
    margin-bottom:1px;
  }
  .data-panel .count{
    font-family:var(--mono);
    font-size:12px;
  }
  .data-panel .count.zero{ color:var(--red); }
  .data-panel .btns{
    display:flex;
    gap:6px;
    flex-shrink:0;
  }
  .data-panel button{
    padding:6px 9px;
    font-size:11px;
  }
  .data-panel input[type=file]{ display:none; }
  .data-panel .filename{
    font-size:10px;
    color:var(--text-dim);
    margin-top:3px;
    font-family:var(--mono);
    word-break:break-all;
  }
  .camera-wrap{
    position:relative;
    background:#000;
    border-radius:10px;
    overflow:hidden;
    aspect-ratio:4/3;
    border:1px solid var(--line);
  }
  video, canvas.shot{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  canvas.shot{ display:none; }
  .frame{
    position:absolute;
    inset:18% 10%;
    pointer-events:none;
  }
  .frame::before,.frame::after,.frame i::before,.frame i::after{
    content:'';
    position:absolute;
    width:22px;height:22px;
    border-color:var(--amber);
    border-style:solid;
    border-width:0;
  }
  .frame::before{top:0;left:0;border-top-width:3px;border-left-width:3px;}
  .frame::after{top:0;right:0;border-top-width:3px;border-right-width:3px;}
  .frame i{position:absolute;inset:0;}
  .frame i::before{bottom:0;left:0;border-bottom-width:3px;border-left-width:3px;}
  .frame i::after{bottom:0;right:0;border-bottom-width:3px;border-right-width:3px;}
  .hint{
    position:absolute;
    bottom:8px;left:0;right:0;
    text-align:center;
    font-size:11px;
    font-family:var(--mono);
    color:#fff;
    text-shadow:0 1px 3px rgba(0,0,0,0.8);
    letter-spacing:0.5px;
  }
  .cam-placeholder{
    position:absolute;
    inset:0;
    background:var(--panel);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
    cursor:pointer;
    color:var(--text-dim);
    font-size:14px;
  }
  .cam-placeholder.hide{ display:none; }
  .cam-icon{ font-size:40px; }
  .controls{
    display:flex;
    gap:10px;
    margin-top:14px;
  }
  button{
    font-family:var(--body);
    font-weight:600;
    font-size:14px;
    border-radius:8px;
    border:1px solid var(--line);
    padding:12px 16px;
    cursor:pointer;
    background:var(--panel-2);
    color:var(--text);
  }
  button.primary{
    background:var(--amber);
    color:#241905;
    border-color:var(--amber);
    flex:1;
  }
  button.primary:disabled{
    opacity:0.5;
    cursor:default;
  }
  button:not(.primary){ flex:0 0 auto; }
  .manual{
    margin-top:14px;
    display:flex;
    gap:8px;
  }
  .manual input{
    flex:1;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:8px;
    padding:10px 12px;
    color:var(--text);
    font-family:var(--mono);
    font-size:13px;
  }
  .manual input::placeholder{ color:var(--text-dim); }
  .status{
    margin-top:10px;
    font-size:12px;
    color:var(--text-dim);
    font-family:var(--mono);
    min-height:16px;
  }
  .status.err{ color:var(--red); }

  .detected-box{
    display:none;
    margin-top:8px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:8px;
    padding:10px 12px;
  }
  .detected-box.show{ display:block; }
  .detected-box label{
    display:block;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.8px;
    color:var(--text-dim);
    margin-bottom:4px;
  }
  .detected-text{
    font-family:var(--mono);
    font-size:13px;
    color:var(--amber);
    word-break:break-word;
    white-space:pre-wrap;
  }
  .detected-row{
    display:flex;
    gap:8px;
  }
  .detected-row input{
    flex:1;
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:6px;
    padding:8px 10px;
    color:var(--amber);
    font-family:var(--mono);
    font-size:13px;
  }
  .detected-row button{
    padding:8px 14px;
    font-size:13px;
    background:var(--amber);
    color:#241905;
    border-color:var(--amber);
    font-weight:600;
  }

  .plate{
    margin-top:22px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:20px 18px 16px;
    position:relative;
    display:none;
  }
  .plate.show{ display:block; }
  .plate .rivet{
    position:absolute;
    width:6px;height:6px;
    border-radius:50%;
    background:var(--line);
  }
  .plate .rivet:nth-child(1){top:10px;left:10px;}
  .plate .rivet:nth-child(2){top:10px;right:10px;}
  .plate .rivet:nth-child(3){bottom:10px;left:10px;}
  .plate .rivet:nth-child(4){bottom:10px;right:10px;}
  .plate .pn-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    border-bottom:1px solid var(--line);
    padding-bottom:12px;
    margin-bottom:12px;
  }
  .plate .pn{
    font-family:var(--mono);
    font-size:22px;
    font-weight:600;
    color:var(--amber);
    letter-spacing:1px;
  }
  .plate .cost{
    font-family:var(--mono);
    font-size:20px;
    font-weight:600;
    color:var(--teal);
  }
  .plate .desc{
    font-family:var(--display);
    font-size:16px;
    font-weight:500;
    margin:0 0 14px;
    text-transform:uppercase;
    letter-spacing:0.3px;
  }
  .specs{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px 16px;
  }
  .specs .field{ border-top:1px solid var(--line); padding-top:8px; }
  .specs .field.full{ grid-column:1/-1; }
  .specs label{
    display:block;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.8px;
    color:var(--text-dim);
    margin-bottom:3px;
  }
  .specs span{
    font-family:var(--mono);
    font-size:13px;
  }
  .matched-on{
    display:inline-block;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.8px;
    color:var(--teal);
    background:rgba(79,167,155,0.12);
    border:1px solid var(--teal);
    border-radius:4px;
    padding:3px 8px;
    margin-bottom:10px;
  }
  .more-btn{
    width:100%;
    margin-top:14px;
    background:transparent;
    color:var(--text-dim);
    font-size:12px;
    padding:8px;
  }
  .raw-dump{
    display:none;
    margin-top:10px;
    border-top:1px solid var(--line);
    padding-top:10px;
  }
  .raw-dump.show{ display:block; }
  .raw-dump .field{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:5px 0;
    border-bottom:1px solid var(--line);
    font-size:12px;
  }
  .raw-dump .field label{ color:var(--text-dim); flex-shrink:0; }
  .raw-dump .field span{ font-family:var(--mono); text-align:right; }

  .candidates{
    margin-top:14px;
    display:none;
    flex-direction:column;
    gap:6px;
  }
  .candidates.show{ display:flex; }
  .candidates .cand-label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.8px;
    color:var(--text-dim);
    margin-bottom:2px;
  }
  .cand-item{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:8px;
    padding:10px 12px;
    cursor:pointer;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
  }
  .cand-item:hover{ border-color:var(--amber); }
  .cand-item .c-pn{
    font-family:var(--mono);
    font-size:13px;
    color:var(--amber);
    flex-shrink:0;
  }
  .cand-item .c-desc{
    font-size:12px;
    color:var(--text-dim);
    text-align:right;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .no-match{
    margin-top:22px;
    background:var(--panel);
    border:1px dashed var(--line);
    border-radius:10px;
    padding:18px;
    text-align:center;
    display:none;
  }
  .no-match.show{ display:block; }
  .no-match .code{
    font-family:var(--mono);
    color:var(--red);
    font-size:14px;
    margin-bottom:4px;
  }
  .no-match p{
    color:var(--text-dim);
    font-size:12px;
    margin:0;
  }
  .db-note{
    margin-top:24px;
    padding-top:14px;
    border-top:1px solid var(--line);
    font-size:11px;
    color:var(--text-dim);
    line-height:1.6;
  }
  .db-note b{ color:var(--text); }
</style>
</head>
<body>

<header>
  <div class="tag"></div>
  <div>
    <h1>Part scanner</h1>
    <p>Point camera at printed part number</p>
  </div>
</header>

<main>
  <div class="data-panel">
    <div class="row">
      <div>
        <div class="label">Part list</div>
        <div class="count" id="dataCount">No file loaded</div>
      </div>
      <div class="btns">
        <button id="loadBtn">Load Excel file</button>
        <button id="clearBtn">Clear</button>
      </div>
    </div>
    <div class="filename" id="dataFilename"></div>
    <input type="file" id="fileInput" accept=".xlsx,.xls,.csv">
  </div>

  <div class="camera-wrap">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="shot" class="shot"></canvas>
    <div class="frame"><i></i></div>
    <div class="hint" id="hint">Align part number in frame</div>
    <div class="cam-placeholder" id="camPlaceholder">
      <div class="cam-icon">&#128247;</div>
      <div>Tap to open camera</div>
    </div>
  </div>

  <div class="controls">
    <button class="primary" id="captureBtn">Scan label</button>
    <button id="switchBtn" title="Switch camera">Flip</button>
  </div>

  <div class="manual">
    <input type="text" id="manualInput" placeholder="Or type part number, e.g. FLT-2201-B">
    <button id="manualBtn">Look up</button>
  </div>

  <div class="status" id="status"></div>
  <div class="detected-box" id="detectedBox">
    <label>Detected from camera &mdash; edit if it read something wrong</label>
    <div class="detected-row">
      <input type="text" id="detectedInput">
      <button id="detectedSearchBtn">Search</button>
    </div>
  </div>

  <div class="plate" id="plate">
    <div class="rivet"></div><div class="rivet"></div><div class="rivet"></div><div class="rivet"></div>
    <div class="matched-on" id="p-matched"></div>
    <div class="pn-row">
      <span class="pn" id="p-num"></span>
      <span class="cost" id="p-cost"></span>
    </div>
    <p class="desc" id="p-desc"></p>
    <div class="specs">
      <div class="field full"><label>Specification / tool number</label><span id="p-spec"></span></div>
      <div class="field"><label>Rack address</label><span id="p-rack"></span></div>
      <div class="field"><label>Location</label><span id="p-location"></span></div>
      <div class="field"><label>Maker</label><span id="p-maker"></span></div>
      <div class="field"><label>Supplier</label><span id="p-supplier"></span></div>
      <div class="field"><label>Lead time (days)</label><span id="p-lead"></span></div>
      <div class="field"><label>MOQ</label><span id="p-moq"></span></div>
      <div class="field"><label>Std stock</label><span id="p-stdstock"></span></div>
      <div class="field"><label>Part status</label><span id="p-status"></span></div>
      <div class="field"><label>Vendor code</label><span id="p-vendor"></span></div>
    </div>
    <button class="more-btn" id="moreBtn">Show all columns</button>
    <div class="raw-dump" id="rawDump"></div>
  </div>

  <div class="candidates" id="candidates"></div>

  <div class="no-match" id="noMatch">
    <div class="code" id="nm-text"></div>
    <p>No part in the list matches this reading. Try again or check the label.</p>
  </div>
</main>

<script>
let PARTS = [];

const KEY_FIELD_ALIASES = {
  part_no: ['part no','part number','partno','part#','part #'],
  old_spec: ['old specification tool number','old specification','old tool number'],
  spec: ['specification tool number','specification','spec','tool number'],
  old_desc: ['old description'],
  desc: ['description'],
  rack_address: ['rack address','rack'],
  maker: ['maker','manufacturer','mfr'],
  supplier: ['supplier name','supplier','vendor'],
  price: ['price','unit price','unit cost'],
  currency: ['currency'],
  total_lt: ['revised total lt days','total lt days','revised total lead time days','total lead time days'],
  moq: ['moq'],
  std_stock: ['std stock'],
  part_status: ['part status'],
  location: ['location'],
  vendor_code: ['vendor code']
};

const SEARCH_FIELDS = ['part_no','old_spec','spec','old_desc','desc'];
const SEARCH_LABELS = {
  part_no: 'Part no', old_spec: 'Old specification', spec: 'Specification',
  old_desc: 'Old description', desc: 'Description'
};

function normalizeHeader(h){
  return String(h || '')
    .replace(/["\r\n]+/g,' ')
    .replace(/\//g,' ')
    .trim()
    .toLowerCase()
    .replace(/\s+/g,' ');
}

function mapRowToPart(row){
  const normalized = {};
  const rawDisplay = {};
  for(const key in row){
    const nk = normalizeHeader(key);
    normalized[nk] = row[key];
    const val = row[key];
    if(val !== undefined && val !== '' && String(key).trim()){
      rawDisplay[String(key).trim()] = val;
    }
  }
  const part = { raw: rawDisplay };
  for(const field in KEY_FIELD_ALIASES){
    let value = '';
    for(const alias of KEY_FIELD_ALIASES[field]){
      if(normalized[alias] !== undefined && normalized[alias] !== ''){
        value = normalized[alias];
        break;
      }
    }
    part[field] = value === undefined ? '' : String(value).trim();
  }
  return part;
}

const ALL_ALIASES = Object.values(KEY_FIELD_ALIASES).flat();

function findHeaderRow(matrix){
  const scanLimit = Math.min(matrix.length, 15);
  let bestRow = 0, bestScore = -1;
  for(let i = 0; i < scanLimit; i++){
    const row = matrix[i] || [];
    let score = 0;
    for(const cell of row){
      const nc = normalizeHeader(cell);
      if(ALL_ALIASES.includes(nc)) score++;
    }
    if(score > bestScore){
      bestScore = score;
      bestRow = i;
    }
  }
  return bestScore > 0 ? bestRow : 0;
}

function loadPartsFromWorkbook(workbook){
  let parts = [];
  for(const sheetName of workbook.SheetNames){
    const sheet = workbook.Sheets[sheetName];
    const matrix = XLSX.utils.sheet_to_json(sheet, { header:1, defval:'', blankrows:false });
    if(matrix.length < 2) continue;
    const headerRowIdx = findHeaderRow(matrix);
    const headers = matrix[headerRowIdx];
    const dataRows = matrix.slice(headerRowIdx + 1);
    const rows = dataRows.map(r => {
      const obj = {};
      headers.forEach((h, i) => { if(h) obj[h] = r[i]; });
      return obj;
    });
    const sheetParts = rows.map(mapRowToPart).filter(p => p.part_no);
    parts = parts.concat(sheetParts);
  }
  return parts;
}

function updateDataCount(){
  const countEl = document.getElementById('dataCount');
  if(PARTS.length === 0){
    countEl.textContent = 'No file loaded';
    countEl.classList.add('zero');
  }else{
    countEl.textContent = PARTS.length.toLocaleString() + ' parts loaded';
    countEl.classList.remove('zero');
  }
}

// ---- IndexedDB storage (handles large datasets; localStorage caps out around 5-10MB) ----
const IDB_NAME = 'partScannerDB';
const IDB_STORE = 'data';

function idbOpen(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(IDB_STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function idbSet(key, value){
  try{
    const db = await idbOpen();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).put(value, key);
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => reject(tx.error);
    });
  }catch(e){ return false; }
}

async function idbGet(key){
  try{
    const db = await idbOpen();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(IDB_STORE, 'readonly');
      const req = tx.objectStore(IDB_STORE).get(key);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }catch(e){ return undefined; }
}

async function idbClear(){
  try{
    const db = await idbOpen();
    return new Promise((resolve) => {
      const tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).clear();
      tx.oncomplete = () => resolve(true);
    });
  }catch(e){ return false; }
}

async function saveDataset(filename){
  await idbSet('parts', PARTS);
  await idbSet('filename', filename || '');
  buildSearchIndex();
}

async function restoreDataset(){
  try{
    const saved = await idbGet('parts');
    const filename = await idbGet('filename');
    if(saved && saved.length){
      PARTS = saved;
      buildSearchIndex();
      updateDataCount();
      if(filename){
        document.getElementById('dataFilename').textContent = 'Loaded from: ' + filename;
      }
    }
  }catch(e){}
}

document.getElementById('loadBtn').addEventListener('click', () => {
  document.getElementById('fileInput').click();
});

document.getElementById('fileInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const loadBtn = document.getElementById('loadBtn');
  loadBtn.disabled = true;
  loadBtn.textContent = 'Reading file…';
  document.getElementById('dataFilename').textContent = 'Reading ' + file.name + ' (' + (file.size/1024/1024).toFixed(1) + ' MB)…';

  const reader = new FileReader();
  reader.onload = (evt) => {
    // setTimeout lets the UI paint the "reading" status before the heavy parse blocks the thread
    setTimeout(() => {
      try{
        const data = new Uint8Array(evt.target.result);
        loadBtn.textContent = 'Parsing rows…';
        const workbook = XLSX.read(data, { type:'array' });
        PARTS = loadPartsFromWorkbook(workbook);
        updateDataCount();
        document.getElementById('dataFilename').textContent = PARTS.length
          ? 'Loaded from: ' + file.name
          : 'No matching rows found — check column headers';
        setStatus(PARTS.length.toLocaleString() + ' parts ready to match against');
        saveDataset(file.name).catch(() => {});
      }catch(err){
        setStatus('Could not read file: ' + err.message, true);
      }finally{
        loadBtn.disabled = false;
        loadBtn.textContent = 'Load Excel file';
      }
    }, 30);
  };
  reader.onerror = () => {
    setStatus('Could not read file', true);
    loadBtn.disabled = false;
    loadBtn.textContent = 'Load Excel file';
  };
  reader.readAsArrayBuffer(file);
});

document.getElementById('clearBtn').addEventListener('click', () => {
  PARTS = [];
  EXACT_INDEX = {};
  updateDataCount();
  document.getElementById('dataFilename').textContent = '';
  idbClear();
  setStatus('Part list cleared');
});

restoreDataset();

async function startCamera(){
  if(currentStream){
    currentStream.getTracks().forEach(t => t.stop());
  }
  try{
    currentStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: facing }, audio:false
    });
    video.srcObject = currentStream;
    hintEl.textContent = 'Align part number in frame';
    cameraStarted = true;
    camPlaceholder.classList.add('hide');
  }catch(err){
    hintEl.textContent = 'Camera unavailable — use manual entry below';
    setStatus('Camera error: ' + err.message, true);
  }
}

function setStatus(text, isErr){
  statusEl.textContent = text || '';
  statusEl.classList.toggle('err', !!isErr);
}

function levenshtein(a, b){
  const m = a.length, n = b.length;
  const dp = Array.from({length:m+1}, () => new Array(n+1).fill(0));
  for(let i=0;i<=m;i++) dp[i][0]=i;
  for(let j=0;j<=n;j++) dp[0][j]=j;
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      dp[i][j] = a[i-1]===b[j-1]
        ? dp[i-1][j-1]
        : 1 + Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
    }
  }
  return dp[m][n];
}

function cleanToken(t){
  return String(t).toUpperCase().replace(/[^A-Z0-9\-]/g,'');
}

// ---- Search index: built once per dataset load so lookups stay fast at 25k+ rows ----
// EXACT_INDEX: cleaned field value -> [{part, field}]  (O(1) exact lookup)
// LENGTH_INDEX: field -> length -> [{part, clean}]     (bucketed for bounded fuzzy fallback)
let EXACT_INDEX = {};
let LENGTH_INDEX = {};
let WORD_INDEX = {};
const WORD_FIELDS = ['desc','old_desc','spec','old_spec'];

// Generic words that show up across many unrelated parts — excluding them from the
// word-level index stops one common word from surfacing an unrelated part as a "match".
const WORD_STOPLIST = new Set([
  'AND','FOR','WITH','FROM','INTO','UPON','THIS','THAT','THE',
  'SET','NOS','QTY','PCS','EACH','ITEM','UNIT','TYPE','SIZE',
  'NEW','OLD','ASSY','ASSEMBLY','PART','PARTS','SPARE','SPARES',
  'STD','GEN','MFG','NOT','ALL','ANY','PER','USE','ONE','TWO'
]);

function buildSearchIndex(){
  EXACT_INDEX = {};
  LENGTH_INDEX = {};
  WORD_INDEX = {};
  for(const field of SEARCH_FIELDS) LENGTH_INDEX[field] = {};

  for(const part of PARTS){
    for(const field of SEARCH_FIELDS){
      const raw = part[field];
      if(!raw) continue;
      const clean = cleanToken(raw);
      if(!clean) continue;

      if(!EXACT_INDEX[clean]) EXACT_INDEX[clean] = [];
      EXACT_INDEX[clean].push({ part, field });

      const len = clean.length;
      if(!LENGTH_INDEX[field][len]) LENGTH_INDEX[field][len] = [];
      LENGTH_INDEX[field][len].push({ part, clean });

      if(WORD_FIELDS.includes(field)){
        const words = String(raw).toUpperCase().split(/[^A-Z0-9]+/)
          .filter(w => w.length >= 4 && !WORD_STOPLIST.has(w));
        for(const word of words){
          if(!WORD_INDEX[word]) WORD_INDEX[word] = [];
          WORD_INDEX[word].push({ part, field });
        }
      }
    }
  }
}

function fuzzyCandidatesForToken(token, field){
  const bucket = LENGTH_INDEX[field];
  const threshold = Math.max(1, Math.floor(token.length * 0.25));
  const matches = [];
  for(let len = token.length - threshold; len <= token.length + threshold; len++){
    const entries = bucket[len];
    if(!entries) continue;
    for(const entry of entries){
      const dist = levenshtein(token, entry.clean);
      if(dist <= threshold){
        matches.push({ part:entry.part, field, score:dist });
      }
    }
  }
  return matches;
}

function rankMatches(rawText){
  const tokens = Array.from(new Set(
    rawText.split(/[\s\n]+/).map(cleanToken).filter(t => t.length >= 3)
  )).slice(0, 12); // cap tokens considered, to bound worst-case work on noisy OCR text

  if(tokens.length === 0) return [];

  const byPart = new Map(); // part -> { score, field, matchedTokens:Set }

  function record(part, field, score, token){
    const existing = byPart.get(part);
    if(!existing){
      byPart.set(part, { score, field, matchedTokens: new Set([token]) });
    }else{
      existing.matchedTokens.add(token);
      if(score < existing.score){
        existing.score = score;
        existing.field = field;
      }
    }
  }

  // Pass 1: exact matches (fast, O(1) per token) — whole-field, then word-level for descriptions/specs
  for(const token of tokens){
    const hits = EXACT_INDEX[token];
    if(hits){
      for(const hit of hits) record(hit.part, hit.field, 0, token);
    }
    const wordHits = WORD_INDEX[token];
    if(wordHits){
      for(const hit of wordHits) record(hit.part, hit.field, 0.2, token);
    }
  }

  // Pass 2: only run bounded fuzzy search if nothing matched exactly
  if(byPart.size === 0){
    for(const token of tokens){
      for(const field of SEARCH_FIELDS){
        const candidates = fuzzyCandidatesForToken(token, field);
        for(const c of candidates) record(c.part, c.field, c.score, token);
      }
    }
  }

  const results = Array.from(byPart.entries()).map(([part, m]) => ({
    part, score:m.score, field:m.field, matchedCount:m.matchedTokens.size
  }));
  // Rank parts matching more of the query terms first (beats a single common-word coincidence),
  // then by closeness of match within that.
  results.sort((a,b) => (b.matchedCount - a.matchedCount) || (a.score - b.score));
  return results;
}

function findMatch(rawText){
  const ranked = rankMatches(rawText);
  return ranked.length ? ranked : null;
}

function setText(id, value){
  document.getElementById(id).textContent = value || '\u2014';
}

function showPart(match, allMatches){
  noMatchEl.classList.remove('show');
  const part = match.part;
  document.getElementById('p-matched').textContent =
    'Matched on ' + SEARCH_LABELS[match.field] + (match.score === 0 ? ' (exact)' : ' (closest match)');
  setText('p-num', part.part_no);
  document.getElementById('p-cost').textContent = part.price
    ? (part.price + (part.currency ? ' ' + part.currency : ''))
    : '\u2014';
  setText('p-desc', part.desc || part.old_desc);
  setText('p-spec', part.spec || part.old_spec);
  setText('p-rack', part.rack_address);
  setText('p-location', part.location);
  setText('p-maker', part.maker);
  setText('p-supplier', part.supplier);
  setText('p-lead', part.total_lt);
  setText('p-moq', part.moq);
  setText('p-stdstock', part.std_stock);
  setText('p-status', part.part_status);
  setText('p-vendor', part.vendor_code);

  const dump = document.getElementById('rawDump');
  dump.innerHTML = '';
  dump.classList.remove('show');
  document.getElementById('moreBtn').textContent = 'Show all columns';
  for(const key in part.raw){
    const row = document.createElement('div');
    row.className = 'field';
    row.innerHTML = '<label></label><span></span>';
    row.querySelector('label').textContent = key;
    row.querySelector('span').textContent = part.raw[key];
    dump.appendChild(row);
  }

  plateEl.classList.add('show');
  renderCandidates(allMatches, part);
}

function renderCandidates(allMatches, excludePart){
  const el = document.getElementById('candidates');
  const rest = (allMatches || []).filter(m => m.part !== excludePart).slice(0, 6);
  if(rest.length === 0){
    el.classList.remove('show');
    el.innerHTML = '';
    return;
  }
  el.innerHTML = '<div class="cand-label">Other possible matches</div>';
  rest.forEach(m => {
    const item = document.createElement('div');
    item.className = 'cand-item';
    item.innerHTML = '<span class="c-pn"></span><span class="c-desc"></span>';
    item.querySelector('.c-pn').textContent = m.part.part_no;
    item.querySelector('.c-desc').textContent = m.part.desc || m.part.old_desc || '';
    item.addEventListener('click', () => showPart(m, allMatches));
    el.appendChild(item);
  });
  el.classList.add('show');
}

document.getElementById('moreBtn').addEventListener('click', () => {
  const dump = document.getElementById('rawDump');
  const btn = document.getElementById('moreBtn');
  dump.classList.toggle('show');
  btn.textContent = dump.classList.contains('show') ? 'Hide all columns' : 'Show all columns';
});

function showNoMatch(readText){
  plateEl.classList.remove('show');
  document.getElementById('candidates').classList.remove('show');
  document.getElementById('nm-text').textContent = readText ? ('Read: "' + readText + '"') : 'No text read';
  noMatchEl.classList.add('show');
}

function otsuThreshold(gray, length){
  // Picks the black/white cutoff automatically from the image's own brightness
  // distribution, instead of guessing one fixed percentage — adapts per photo
  // (bright label vs dim label, glare vs shade) far better than a fixed split.
  const histogram = new Array(256).fill(0);
  for(let i = 0; i < length; i++) histogram[gray[i]]++;
  let sum = 0;
  for(let t = 0; t < 256; t++) sum += t * histogram[t];
  let sumB = 0, wB = 0, varMax = 0, threshold = 128;
  for(let t = 0; t < 256; t++){
    wB += histogram[t];
    if(wB === 0) continue;
    const wF = length - wB;
    if(wF === 0) break;
    sumB += t * histogram[t];
    const mB = sumB / wB;
    const mF = (sum - sumB) / wF;
    const varBetween = wB * wF * (mB - mF) * (mB - mF);
    if(varBetween > varMax){
      varMax = varBetween;
      threshold = t;
    }
  }
  return threshold;
}

function preprocessForOcr(sourceCanvas){
  // Crop to the visible guide frame (inset 18% top/bottom, 10% left/right — matches the CSS overlay)
  // so grid-paper background and glare outside the label don't confuse the OCR engine.
  const sx = Math.round(sourceCanvas.width * 0.10);
  const sy = Math.round(sourceCanvas.height * 0.18);
  const sw = Math.round(sourceCanvas.width * 0.80);
  const sh = Math.round(sourceCanvas.height * 0.64);

  // OCR engines read small text unreliably — upscale so the cropped text has real pixel height.
  const targetHeight = 320;
  const scale = sh < targetHeight ? Math.min(3, targetHeight / sh) : 1;
  const outW = Math.round(sw * scale);
  const outH = Math.round(sh * scale);

  const cropped = document.createElement('canvas');
  cropped.width = outW;
  cropped.height = outH;
  const cctx = cropped.getContext('2d');
  cctx.imageSmoothingEnabled = true;
  cctx.imageSmoothingQuality = 'high';
  cctx.drawImage(sourceCanvas, sx, sy, sw, sh, 0, 0, outW, outH);

  // Grayscale, then adaptive (Otsu) threshold: makes printed text stand out from
  // paper grid-lines and glare far more consistently than a fixed contrast guess.
  const imgData = cctx.getImageData(0, 0, outW, outH);
  const d = imgData.data;
  const pixelCount = outW * outH;
  const gray = new Uint8ClampedArray(pixelCount);
  for(let i = 0, p = 0; i < d.length; i += 4, p++){
    gray[p] = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
  }
  const threshold = otsuThreshold(gray, pixelCount);
  // fg = true means "ink" (darker than threshold) — candidate text pixel
  const fg = new Uint8Array(pixelCount);
  for(let p = 0; p < pixelCount; p++) fg[p] = gray[p] <= threshold ? 1 : 0;

  removeGridLines(fg, outW, outH);

  for(let i = 0, p = 0; i < d.length; i += 4, p++){
    const v = fg[p] ? 0 : 255;
    d[i] = d[i+1] = d[i+2] = v;
  }
  cctx.putImageData(imgData, 0, 0);
  return cropped;
}

function localThickness(original, w, h, isHorizontal, fixedCoord, t, band){
  let thickness = 0;
  for(let d = -band; d <= band; d++){
    if(isHorizontal){
      const yy = fixedCoord + d;
      if(yy >= 0 && yy < h && original[yy*w + t] === 1) thickness++;
    }else{
      const xx = fixedCoord + d;
      if(xx >= 0 && xx < w && original[t*w + xx] === 1) thickness++;
    }
  }
  return thickness;
}

function removeGridLines(fg, w, h){
  // Erases long, thin, straight runs of ink — that's what a printed grid line looks like
  // after thresholding. Real character strokes are short and comparatively thick, so they
  // survive this pass. Graph-paper backgrounds are what caused the extra garbled characters.
  // Both directions are measured against the original data so erasing horizontal lines
  // doesn't fragment (and hide) the vertical lines from detection, and vice versa.
  // Within a run long enough to be a line candidate, each pixel is judged individually —
  // so if text happens to cross the line's path, that thicker local stretch is preserved
  // instead of the whole run being erased as one unit.
  const original = fg.slice();
  const minRunFraction = 0.5;
  const maxThickness = 3;
  const band = 3;

  const minRunW = Math.round(w * minRunFraction);
  for(let y = 0; y < h; y++){
    let runStart = -1;
    for(let x = 0; x <= w; x++){
      const isFg = x < w && original[y*w + x] === 1;
      if(isFg && runStart === -1) runStart = x;
      if(!isFg && runStart !== -1){
        if(x - runStart >= minRunW){
          for(let xi = runStart; xi < x; xi++){
            if(localThickness(original, w, h, true, y, xi, band) <= maxThickness){
              fg[y*w + xi] = 0;
            }
          }
        }
        runStart = -1;
      }
    }
  }

  const minRunH = Math.round(h * minRunFraction);
  for(let x = 0; x < w; x++){
    let runStart = -1;
    for(let y = 0; y <= h; y++){
      const isFg = y < h && original[y*w + x] === 1;
      if(isFg && runStart === -1) runStart = y;
      if(!isFg && runStart !== -1){
        if(y - runStart >= minRunH){
          for(let yi = runStart; yi < y; yi++){
            if(localThickness(original, w, h, false, x, yi, band) <= maxThickness){
              fg[yi*w + x] = 0;
            }
          }
        }
        runStart = -1;
      }
    }
  }
}


function performSearch(query, sourceLabel){
  if(PARTS.length === 0){
    setStatus('Load your part list first', true);
    return;
  }
  const val = (query || '').trim();
  if(!val){
    setStatus('Enter a part number first', true);
    return;
  }
  const matches = findMatch(val);
  if(matches){
    showPart(matches[0], matches);
    setStatus((matches[0].score === 0 ? 'Exact match found' : 'Closest match found') + (sourceLabel ? '' : ''));
  }else{
    showNoMatch(val);
    setStatus('No match', true);
  }
}

async function runOcr(){
  if(PARTS.length === 0){
    setStatus('Load your part list first', true);
    return;
  }
  if(!cameraStarted){
    setStatus('Tap the camera preview to open it first', true);
    return;
  }
  captureBtn.disabled = true;
  setStatus('Reading label…');
  const ctx = shot.getContext('2d');
  shot.width = video.videoWidth;
  shot.height = video.videoHeight;
  ctx.drawImage(video, 0, 0, shot.width, shot.height);

  try{
    const processed = preprocessForOcr(shot);
    const { data } = await Tesseract.recognize(processed, 'eng', {
      logger: m => {
        if(m.status === 'recognizing text'){
          setStatus('Reading label… ' + Math.round(m.progress*100) + '%');
        }
      },
      tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-/. ',
      tessedit_pageseg_mode: 11
    });
    const text = (data.text || '').trim();
    const detectedBox = document.getElementById('detectedBox');
    const detectedInput = document.getElementById('detectedInput');
    if(text){
      detectedInput.value = text.replace(/\n/g,' ').replace(/\s+/g,' ').trim();
      detectedBox.classList.add('show');
    }else{
      detectedBox.classList.remove('show');
    }
    setStatus(text ? 'Text detected — review/edit below, then Search' : 'No text detected — try again or type it manually');
    if(text){
      performSearch(text, 'camera');
    }else{
      showNoMatch('');
    }
  }catch(err){
    setStatus('OCR failed: ' + err.message, true);
  }finally{
    captureBtn.disabled = false;
  }
}

captureBtn.addEventListener('click', runOcr);

document.getElementById('detectedSearchBtn').addEventListener('click', () => {
  performSearch(document.getElementById('detectedInput').value, 'camera-edited');
});
document.getElementById('detectedInput').addEventListener('keydown', e => {
  if(e.key === 'Enter') document.getElementById('detectedSearchBtn').click();
});

manualBtn.addEventListener('click', () => {
  document.getElementById('detectedBox').classList.remove('show');
  performSearch(manualInput.value, 'manual');
});
manualInput.addEventListener('keydown', e => { if(e.key === 'Enter') manualBtn.click(); });

if('serviceWorker' in navigator){
  let swRefreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if(swRefreshing) return;
    swRefreshing = true;
    window.location.reload();
  });
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then((reg) => {
      // Check for a newer sw.js each time the app is opened, so updates arrive without manual cache-clearing.
      reg.update().catch(() => {});
    }).catch(() => {});
  });
}
